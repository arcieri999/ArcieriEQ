name: Build Arcieri EQ

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configurar (macOS, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release

      - name: Crear instalador macOS (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R "build/ArcieriEQ_artefacts/Release/VST3/Arcieri EQ.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          xattr -cr pkgroot
          codesign --force --deep -s - "pkgroot/Library/Audio/Plug-Ins/VST3/Arcieri EQ.vst3"
          chmod +x installer/mac/scripts/postinstall
          pkgbuild --root pkgroot --scripts installer/mac/scripts --identifier com.arcieri.eq --version 1.0.0 --install-location / ArcieriEQ-component.pkg
          productbuild --package ArcieriEQ-component.pkg dist/ArcieriEQ-Installer-macOS.pkg

      - name: Crear instalador Windows (.exe)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Join-Path $env:GITHUB_WORKSPACE "build\ArcieriEQ_artefacts\Release\VST3"
          $iss = Join-Path $env:GITHUB_WORKSPACE "ArcieriEQ_installer.iss"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist"
          @'
          [Setup]
          AppName=Arcieri EQ
          AppVersion=1.0.0
          AppPublisher=Arcieri
          DefaultDirName={commonpf64}\Arcieri EQ
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputBaseFilename=ArcieriEQ-Installer-Windows
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "{#BuildDir}\Arcieri EQ.vst3\*"; DestDir: "{commoncf64}\VST3\Arcieri EQ.vst3"; Flags: recursesubdirs createallsubdirs ignoreversion
          '@ | Set-Content -Path $iss -Encoding ASCII
          Get-Content $iss
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          Write-Host "ISCC: $iscc"
          & $iscc "/O$out" "/DBuildDir=$vst" $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $out

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-${{ matrix.os }}
          path: dist
