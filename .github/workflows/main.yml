name: Build Arcieri EQ

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configurar (macOS, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release

      - name: Crear instalador macOS (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist pkgroot/Library/Audio/Plug-Ins/VST3
          cp -R "build/ArcieriEQ_artefacts/Release/VST3/Arcieri EQ.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          xattr -cr pkgroot
          codesign --force --deep -s - "pkgroot/Library/Audio/Plug-Ins/VST3/Arcieri EQ.vst3"
          chmod +x installer/mac/scripts/postinstall
          pkgbuild --root pkgroot --scripts installer/mac/scripts --identifier com.arcieri.eq --version 1.0.0 --install-location / ArcieriEQ-component.pkg
          productbuild --package ArcieriEQ-component.pkg dist/ArcieriEQ-Installer-macOS.pkg

      - name: Crear instalador Windows (.exe)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Join-Path $env:GITHUB_WORKSPACE "build\ArcieriEQ_artefacts\Release\VST3"
          Get-ChildItem -Recurse $vst | Select-Object -First 30 FullName
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          Write-Host "ISCC: $iscc"
          & $iscc "/O$env:GITHUB_WORKSPACE\dist" "/DBuildDir=$vst" "installer\windows\ArcieriEQ.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-${{ matrix.os }}
          path: dist
